name: SigNoz hosting CI

on:
  push:
    paths:
      - "src/BuildingBlocks.Aspire.Hosting.SigNoz/**"
      - "tests/BuildingBlocks.Aspire.Hosting.SigNoz.Tests/**"
      - ".github/workflows/telemetry-signoz.yml"
  pull_request:
    paths:
      - "src/BuildingBlocks.Aspire.Hosting.SigNoz/**"
      - "tests/BuildingBlocks.Aspire.Hosting.SigNoz.Tests/**"
      - ".github/workflows/telemetry-signoz.yml"
  workflow_dispatch:

concurrency:
  group: telemetry-signoz-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-pack:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Test
        run: dotnet test tests/BuildingBlocks.Aspire.Hosting.SigNoz.Tests/BuildingBlocks.Aspire.Hosting.SigNoz.Tests.csproj -c Release --verbosity minimal

      - name: Pack
        run: dotnet pack src/BuildingBlocks.Aspire.Hosting.SigNoz/BuildingBlocks.Aspire.Hosting.SigNoz.csproj -c Release -o artifacts/nuget -p:ContinuousIntegrationBuild=true

      - name: Upload nupkg
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages-signoz
          path: |
            artifacts/nuget/*.nupkg
            artifacts/nuget/*.snupkg
          if-no-files-found: error
