name: MCP release

# Publishes BuildingBlocks.Mcp when an mcp-v* tag is pushed.
# Tag format: mcp-vX.Y.Z must match <Version> in BuildingBlocks.Mcp.csproj.

on:
  release:
    types: [published]
  push:
    tags:
      - "mcp-v*"
  workflow_dispatch:
    inputs:
      publish_nuget:
        description: "Push to nuget.org (requires Trusted Publishing + NUGET_USER)"
        type: boolean
        default: false

jobs:
  release:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref_name, 'mcp-v') }}
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write
      contents: write
    env:
      NUGET_USER: ${{ secrets.NUGET_USER }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/BuildingBlocks/Mcp/BuildingBlocks.Mcp.csproj | head -1)
          echo "project=$PROJECT_VERSION" >> "$GITHUB_OUTPUT"
          REF="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$REF"
            STRIPPED="${TAG#mcp-v}"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "from_tag=$STRIPPED" >> "$GITHUB_OUTPUT"
            if [[ "$STRIPPED" != "$PROJECT_VERSION" ]]; then
              echo "::error::Tag version ($STRIPPED) does not match project <Version> ($PROJECT_VERSION)"
              exit 1
            fi
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "from_tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build analyzers
        run: dotnet build src/BuildingBlocks/Mcp.Analyzers/BuildingBlocks.Mcp.Analyzers.csproj -c Release

      - name: Test library
        run: dotnet test tests/BuildingBlocks/Mcp.Tests/BuildingBlocks.Mcp.Tests.csproj -c Release --verbosity minimal

      - name: Test analyzers
        run: dotnet test tests/BuildingBlocks/Mcp.Analyzers.Tests/BuildingBlocks.Mcp.Analyzers.Tests.csproj -c Release --verbosity minimal

      - name: Pack
        run: dotnet pack src/BuildingBlocks/Mcp/BuildingBlocks.Mcp.csproj -c Release -o artifacts/nuget -p:ContinuousIntegrationBuild=true

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages-release
          path: |
            artifacts/nuget/*.nupkg
            artifacts/nuget/*.snupkg
          if-no-files-found: error

      - name: Attach packages to GitHub Release
        if: github.event_name == 'release'
        continue-on-error: true
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            artifacts/nuget/*.nupkg
            artifacts/nuget/*.snupkg

      - name: Create GitHub Release for tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: BuildingBlocks.Mcp ${{ steps.ver.outputs.project }}
          generate_release_notes: true
          files: |
            artifacts/nuget/*.nupkg
            artifacts/nuget/*.snupkg

      - name: NuGet login (Trusted Publishing OIDC)
        if: ${{ env.NUGET_USER != '' && (github.event_name != 'workflow_dispatch' || inputs.publish_nuget) }}
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ env.NUGET_USER }}

      - name: Push to nuget.org
        if: ${{ env.NUGET_USER != '' && (github.event_name != 'workflow_dispatch' || inputs.publish_nuget) && steps.login.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for pkg in artifacts/nuget/*.nupkg; do
            dotnet nuget push "$pkg" \
              --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
          for spkg in artifacts/nuget/*.snupkg; do
            dotnet nuget push "$spkg" \
              --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate || true
          done

      - name: Dry-run notice
        if: ${{ env.NUGET_USER == '' || (github.event_name == 'workflow_dispatch' && !inputs.publish_nuget) }}
        run: |
          echo "Skipped nuget.org push (NUGET_USER unset or publish_nuget=false)."
